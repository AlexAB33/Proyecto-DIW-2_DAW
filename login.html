<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
        <link rel="stylesheet" href="build/css/styles.css">
    </head>
    <body>
        <div class="container-fluid row h-100 align-content-center justify-content-center">                
            <div class="col-md-4"></div>
            <div class="col-md-4">
                <div class="card shadow">                   
                    <div class="card-body bg-light">
                        <div class="bg-white">
                            <h4 class="bg-primary text-center p-2 text-bg-secondary text-uppercase fw-light">Login de administradores</h4>
                        </div>
                        <form action="index.html" class="needs-validation" novalidate method="POST">
                            <div class="mb-3 ">
                                <label for="email" class="form-label fw-light small">Email address</label>
                                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                                <div class="valid-feedback">Campo válido</div>
                                <div class="invalid-feedback">Campo inválido</div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-light small">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Password" required>
                                <div class="valid-feedback">Campo válido</div>
                                <div class="invalid-feedback">Campo inválido</div>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label fw-light small" for="remember">Recordar</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <button type="submit" class="btn btn-primary w-30">Iniciar Sesión</button>
                            </div>
                            
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-4"></div>
        </div>
        


        <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
     </body>
</html>
