<!doctype html>
<html lang="es">
<head>
<title>Prueba</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="build/css/styles.css">
</head>
<body>
    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid container">
            <a class="navbar-brand" href="#">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Pricing</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- FEATURES -->
    <div class="container py-5" id="custom-cards">
        <h1 class="text-center">Features</h1>
    
        <div class="row row-cols-1 row-cols-lg-3 align-items-stretch g-4 py-5">
            <div class="col">
                <div class="card card-cover h-100 text-white rounded-4 shadow-lg" style="background-color: #dc3545;">
                    <div class="d-flex flex-column h-100 p-5 pb-3 text-white text-shadow-1">
                        <div class="text-center mb-4">
                            <i class="bi bi-briefcase display-1"></i>
                        </div>
                        <h3 class="mb-4 display-6 lh-1 fw-bold text-center">Busca Empleos</h3>
                        <ul class="d-flex list-unstyled mt-auto justify-content-between">
                            <li class="d-flex align-items-center">
                                <i class="bi bi-search me-2"></i>
                                <small>Ofertas</small>
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bi bi-building me-2"></i>
                                <small>Empresas</small>
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bi bi-geo-alt me-2"></i>
                                <small>Ubicación</small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card card-cover h-100 overflow-hidden text-white rounded-4 shadow-lg" style="background-color: #0d6efd;">
                    <div class="d-flex flex-column h-100 p-5 pb-3 text-white text-shadow-1">
                        <div class="text-center mb-4">
                            <i class="bi bi-graph-up-arrow display-1"></i>
                        </div>
                        <h3 class="mb-4 display-6 lh-1 fw-bold text-center">Estadísticas Laborales</h3>
                        <ul class="d-flex list-unstyled mt-auto justify-content-between">
                            <li class="d-flex align-items-center">
                                <i class="bi bi-bar-chart me-2"></i>
                                <small>Análisis</small>
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bi bi-mortarboard me-2"></i>
                                <small>Egresados</small>
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bi bi-currency-euro me-2"></i>
                                <small>Salarios</small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            
            <div class="col">
                <div class="card card-cover h-100 text-dark rounded-4 shadow-lg" style="background-color: #ffc107;">
                    <div class="d-flex flex-column h-100 p-5 pb-3">
                        <div class="text-center mb-4">
                            <i class="bi bi-people display-1"></i>
                        </div>
                        <h3 class="mb-4 display-6 lh-1 fw-bold text-center">Red de Contactos</h3>
                        <ul class="d-flex list-unstyled mt-auto justify-content-between">
                            <li class="d-flex align-items-center">
                                <i class="bi bi-person-plus me-2"></i>
                                <small>Conexiones</small>
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bi bi-chat-dots me-2"></i>
                                <small>Mensajes</small>
                            </li>
                            <li class="d-flex align-items-center">
                                <i class="bi bi-calendar-event me-2"></i>
                                <small>Eventos</small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>    

    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
